<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; }
  body { width: 512px; height: 512px; background: hsl(0 0% 9%); display: grid; place-items: center; }
</style>
</head>
<body>
  <!-- The site header mark (Icons.logo), ink canvas so it holds up at 20px
       in GitHub chrome; the trailing slash carries the one brand accent. -->
  <svg width="400" height="400" viewBox="0 0 256 256" fill="none">
    <line x1="192" y1="40" x2="40" y2="192" stroke="hsl(0 0% 98%)" stroke-width="18" stroke-linecap="round"/>
    <line x1="208" y1="128" x2="128" y2="208" stroke="hsl(152 45% 45%)" stroke-width="18" stroke-linecap="round"/>
  </svg>
</body>
</html>
