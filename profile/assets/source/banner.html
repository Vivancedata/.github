<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="brand.css">
<style>
  body { width: 1280px; height: 640px; }
  .left { position: absolute; left: 72px; top: 56px; bottom: 53px; width: 640px; display: flex; flex-direction: column; }
  .left main { margin: auto 0; }
  h1 { font-size: 76px; line-height: 0.98; max-width: 17ch; text-wrap: balance; }
  .turn { font-style: italic; font-size: 33px; line-height: 1.1; color: var(--prose); max-width: 26ch; margin-top: 22px; letter-spacing: -0.015em; }
  .right { position: absolute; right: 0; top: 0; bottom: 53px; width: 504px; border-left: 1px solid var(--rule); }
  .right .dots { position: absolute; inset: 0; }
  .right .url { position: absolute; top: 62px; right: 72px; color: var(--mute); }
  .right .record { position: absolute; left: 44px; right: 72px; top: 50%; transform: translateY(-46%); }
  .ledger { position: absolute; left: 0; right: 0; bottom: 0; height: 53px; padding: 0 72px; }
</style>
</head>
<body>
  <div class="left">
    <div class="lockup">
      <span class="mark" id="mark"></span>
      <span>VivanceData</span>
    </div>
    <main>
      <h1 class="serif" id="title"></h1>
      <p class="serif turn" id="turn"></p>
    </main>
  </div>

  <div class="right">
    <div class="dots"></div>
    <p class="data url" id="url"></p>
    <div class="record">
      <header>
        <p class="data"><span id="stamp"></span><span class="sep">/</span><span class="src" id="source"></span></p>
        <p class="label" id="tag"></p>
      </header>
      <blockquote id="input"></blockquote>
      <dl id="fields"></dl>
    </div>
  </div>

  <div class="ledger data" id="ledger"></div>

  <script src="mark.js"></script>
  <script>
    document.getElementById('mark').innerHTML = mark('small');
    const MARK = {
      filled: '<svg class="filled" viewBox="0 0 12 12"><path d="M2 6.4 4.8 9.2 10 3.4"/></svg>',
      flag: '<svg class="flag" viewBox="0 0 12 12"><path d="M6 1.6 11 10.4H1z"/><path d="M6 5v2.1"/><path d="M6 9h.01"/></svg>',
      plain: '',
    };
    // The sample record is the first one in the site's night log, verbatim.
    const CALL = {
      stamp: '22:41', source: 'Voicemail · 41s', tag: 'Sample',
      input: '“…there’s no heat at all, the whole upstairs, and they’re saying it drops below freezing tonight.”',
      fields: [['Caller', 'Marisol Reyes', 'filled'], ['Address', '118 Harlow Ave', 'filled'], ['Fault', 'No heat, occupied home', 'filled'], ['Urgency', 'Overnight', 'flag'], ['Booked', 'Tue 06:30', 'filled']],
    };
    const repo = (name, rows) => ({ stamp: 'Vivancedata', source: name, tag: 'Repo', input: '', fields: rows.map(([k, v]) => [k, v, 'plain']) });
    const VARIANTS = {
      org: { title: 'Someone has to answer the phone and key in the paperwork', turn: 'It does not have to be a person on your payroll.', url: 'vivancedata.com', record: CALL },
      vivancedata: { title: 'The practice’s site', turn: 'One workflow at a time, proved on your own documents.', url: 'vivancedata.com',
        record: repo('vivancedata', [['Stack', 'Next.js, TypeScript'], ['Design', '@vivancedata/ui'], ['Live', 'vivancedata.com']]) },
      ui: { title: 'One design language for every surface', turn: 'Tokens and React components, released as a versioned package.', url: 'github.com/Vivancedata/ui',
        record: repo('ui', [['Package', '@vivancedata/ui'], ['Ships', 'Tokens, components'], ['Used by', 'Six apps']]) },
      crm: { title: 'The practice’s client records', turn: 'Pipeline, projects and follow-through.', url: 'github.com/Vivancedata/crm',
        record: repo('crm', [['Stack', 'Next.js, TypeScript'], ['Design', '@vivancedata/ui'], ['Access', 'Internal']]) },
      learn: { title: 'Eureka', turn: 'A side project: learning paths for AI and data skills.', url: 'learn.vivancedata.com',
        record: repo('learn', [['Stack', 'Next.js, TypeScript'], ['Design', '@vivancedata/ui'], ['Live', 'learn.vivancedata.com']]) },
    };
    const v = VARIANTS[new URLSearchParams(location.search).get('v') || 'org'];
    const set = (id, text) => { document.getElementById(id).textContent = text; };
    set('title', v.title); set('turn', v.turn); set('url', v.url);
    set('stamp', v.record.stamp); set('source', v.record.source); set('tag', v.record.tag);
    const input = document.getElementById('input');
    if (v.record.input) input.textContent = v.record.input; else input.remove();
    document.getElementById('fields').innerHTML = v.record.fields
      .map(([k, val, verdict]) => `<div><dt class="label">${k}</dt><dd class="data">${MARK[verdict]}<span>${val}</span></dd></div>`).join('');
    document.getElementById('ledger').innerHTML = ['RFI-0412', '22:41', 'PO-2291-B', 'DR-88301', 'SUBMITTAL 03-21', '07:12', 'IMG_4471', 'WO-5518', '12,480 lb', 'NO HEAT', 'PERMIT B-2209']
      .map((m) => `<span>${m}</span>`).join('');
  </script>
</body>
</html>
