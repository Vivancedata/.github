<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="brand.css">
<style>
  body { width: 512px; height: 512px; display: grid; place-items: center; }
  svg { width: 420px; height: 420px; }
  .small svg { width: 480px; height: 480px; }
</style>
</head>
<body>
  <script src="mark.js"></script>
  <!-- ?cut=small renders the favicon cut. -->
  <script>
    const cut = new URLSearchParams(location.search).get('cut') || 'full';
    document.body.className = cut;
    document.body.insertAdjacentHTML('beforeend', mark(cut));
  </script>
</body>
</html>
